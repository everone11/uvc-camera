apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.everone11.uvccamera.xposed"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // libxposed API 102（LSPosed 新版接口，XposedModule 入口 + 模块内 SharedPreferences 访问）
    compileOnly 'io.github.libxposed:api:102.0.0'
}
